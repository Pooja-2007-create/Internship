<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F1E8">
    <title>Regional Sweets | Sweetify</title>

    <script src="auth.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sweets.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img class="brand-mark" src="images/sweetify-mark.svg" alt="">
                SWEETIFY<span>.</span>
            </a>
            <a href="index.html" class="collection-back">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Back to shop
            </a>
            <button class="cart-btn" id="cart-btn" type="button">
                <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                Cart
                <span id="cart-count">0</span>
            </button>
        </nav>
    </header>

    <main>
        <section class="regional-collection section-padding">
            <div class="section-heading">
                <p>SWEET TRADITIONS FROM EVERY CORNER</p>
                <h1>Regional Indian Sweets</h1>
                <span>Discover beloved flavours and specialties from across India.</span>
            </div>

            <div class="product-controls">
                <input type="text" id="search-input" placeholder="Search regional sweets..." aria-label="Search regional sweets">
                <select id="filter-category" aria-label="Filter by category">
                    <option value="All">All Categories</option>
                    <option value="Traditional">Traditional</option>
                    <option value="Milk">Milk Sweets</option>
                    <option value="Special">Special Sweets</option>
                </select>
            </div>

            <div class="product-container" id="product-container"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <h2>
                <img class="brand-mark" src="images/sweetify-mark.svg" alt="">
                SWEETIFY<span>.</span>
            </h2>
            <p>Making every celebration a little sweeter.</p>
        </div>
        <p class="copyright">© 2026 Sweetify. All Rights Reserved.</p>
    </footer>

    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-panel">
            <div class="cart-header">
                <h2>Your Shopping Bag</h2>
                <button id="close-cart" type="button" aria-label="Close cart">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div id="cart-items">
                <p class="empty-cart">Your cart is empty.</p>
            </div>
            <div class="cart-footer">
                <h3>Total: ₹<span id="cart-total">0</span></h3>
                <button id="checkout-btn" class="primary-btn" type="button">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="regional-sweets.js"></script>
    <script src="sweets.js"></script>
</body>
</html>
